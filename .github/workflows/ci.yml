name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  generated-code:
    name: Generated code is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Regenerate SDK from openapi.json
        run: npm run generate
      - name: Fail if generated code differs from committed code
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated code is out of date. Run 'npm run generate' and commit the result."
            exit 1
          fi

  format-lint-compile:
    name: Format, lint & compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting (prettier)
        run: npm run format:check
      - name: Lint (oxlint)
        run: npm run lint
      - name: Compile (tsup + tsc)
        run: npm run compile

  version-check:
    name: Version check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate package.json version
        run: npm run check-version
